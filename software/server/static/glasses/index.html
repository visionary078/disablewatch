<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <title>看见下一步 · 眼镜</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="glasses-only">
    <video id="preview" class="preview preview-off" playsinline autoplay muted></video>
    <p id="status" class="sr-only">按住说话</p>
    <p id="speech" class="sr-only" role="status" aria-live="assertive">按住按钮，说要找什么。</p>
    <p id="meta" class="sr-only"></p>
    <button id="talk-btn" class="talk-only" type="button">按住说话</button>
    <div id="settings" class="settings hidden" role="dialog" aria-labelledby="settings-title">
      <div class="gate-card">
        <h2 id="settings-title">连接设置</h2>
        <label for="api-input">服务器地址</label>
        <input id="api-input" type="url" autocomplete="off" />
        <label for="token-input">使用密码</label>
        <input id="token-input" type="password" autocomplete="off" />
        <button id="save-settings" type="button">保存</button>
        <button id="close-settings" class="ghost" type="button">关闭</button>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
