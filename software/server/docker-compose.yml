services:
  watchapi:
    build: .
    image: watchapi:latest
    container_name: watchapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://api.xiaomimimo.com/v1}
      MODEL_NAME: ${MODEL_NAME:-mimo-v2.5}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
