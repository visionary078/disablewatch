<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>看见下一步 · 眼镜</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip" href="#start-btn">跳到开始</a>
    <header id="header" class="header" aria-label="长按打开设置">
      <p class="eyebrow">看见下一步 · 眼镜</p>
      <h1 id="status">抬头看前方，腾出手来</h1>
    </header>

    <main>
      <p id="speech" class="speech" role="status" aria-live="assertive">
        戴上或把镜头朝前。点开始后，我边看边说哪边、近不近。
      </p>
      <p id="meta" class="meta">未开始</p>
      <video id="preview" class="preview" playsinline autoplay muted></video>
    </main>

    <div id="gate" class="gate" role="dialog" aria-labelledby="gate-title">
      <div class="gate-card">
        <p class="eyebrow">看见下一步</p>
        <h2 id="gate-title">朝哪看，说哪边</h2>
        <p>
          戴上以后我跟着你的视线看。你说要找什么，我就说在哪一侧、近不近。手杖照常用，过马路别靠我。
        </p>
        <button id="start-btn" type="button">开始看</button>
        <button id="gate-settings" class="ghost" type="button">使用密码</button>
      </div>
    </div>

    <div id="settings" class="settings hidden" role="dialog" aria-labelledby="settings-title">
      <div class="gate-card">
        <h2 id="settings-title">连接设置</h2>
        <label for="api-input">服务器地址</label>
        <input id="api-input" type="url" autocomplete="off" placeholder="一般不用改" />
        <label for="token-input">使用密码</label>
        <input id="token-input" type="password" autocomplete="off" />
        <button id="save-settings" type="button">保存</button>
        <button id="close-settings" class="ghost" type="button">关闭</button>
      </div>
    </div>

    <footer class="dock">
      <button id="talk-btn" type="button" disabled>按住，说要找什么</button>
      <button id="precise-btn" class="ghost" type="button" disabled>再看一眼</button>
      <button id="stop-btn" class="ghost" type="button" disabled>停止</button>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
