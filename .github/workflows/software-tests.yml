name: software tests

on:
  pull_request:
    paths:
      - "software/server/**"
      - ".github/workflows/software-tests.yml"
  push:
    branches: [main]
    paths:
      - "software/server/**"
      - ".github/workflows/software-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: pip install -r requirements-server.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
